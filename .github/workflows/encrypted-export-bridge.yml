name: Encrypted export handoff
on:
  push:
    paths:
      - '.github/workflows/encrypted-export-bridge.yml'
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Transfer sealed deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir sealed
          # Only AES-256-GCM ciphertext crosses this relay.
          # No decryption key, plaintext media, or project source is committed.
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            'https://terrorism-item-electron-castle.trycloudflare.com/sealed/01' \
            --output sealed/video.aesgcm
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            'https://terrorism-item-electron-castle.trycloudflare.com/sealed/02' \
            --output sealed/project.aesgcm
          sha256sum sealed/*.aesgcm
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-final-delivery
          path: sealed/*.aesgcm
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
